apiVersion: core.akuity.io/v1alpha1
kind: NamespaceClass
metadata:
  name: public-network
spec:
  resources:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-public-ingress
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - {}
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: public-workload-sa
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: network-environment
      data:
        environment: "public"
        securityZone: "dmz"
