apiVersion: core.akuity.io/v1alpha1
kind: NamespaceClass
metadata:
  name: internal-network
spec:
  resources:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: restrict-to-corporate-vpn
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
          - Egress
        ingress:
          - from:
              - ipBlock:
                  cidr: 10.0.0.0/8
        egress:
          - to:
              - ipBlock:
                  cidr: 10.0.0.0/8
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: internal-workload-sa
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: network-environment
      data:
        environment: "internal"
        securityZone: "vpn-only"
